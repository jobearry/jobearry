name: Update README stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Top Languages card
        run: |
          mkdir -p assets
          curl --fail --silent --show-error --location \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=jobearry&layout=compact&theme=radical" \
            --output assets/top-langs.svg

      - name: Commit updated card
        run: |
          if git diff --quiet -- assets/top-langs.svg; then
            echo "Stats card is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs.svg
          git commit -m "Update README stats"
          git push