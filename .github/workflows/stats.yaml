name: Update README stats

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=radical"
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # Guard against committing an empty/placeholder SVG if the card renderer
      # returns something invalid without reporting an error.
      - name: Validate card
        run: |
          test -s assets/top-langs.svg
          grep -q "<svg" assets/top-langs.svg
          if [ "$(wc -c < assets/top-langs.svg)" -lt 200 ]; then
            echo "Generated card looks empty; refusing to commit."
            exit 1
          fi

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs.svg
          if git diff --cached --quiet; then
            echo "Card is unchanged."
            exit 0
          fi
          git commit -m "Update README cards"
          git push